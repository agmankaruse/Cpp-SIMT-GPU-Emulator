name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DENABLE_TESTS=ON -DENABLE_WARNINGS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run example kernel
        run: ./build/simt_gpu examples/vector_add.gpuasm
      - name: Run differential verification
        run: ./build/simt_gpu --diff examples/vector_add.gpuasm
